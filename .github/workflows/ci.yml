name: Drug Induced Liver Injury Dili CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: ci-only-dili-audit-key-not-for-production
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[server,test]'

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check browser application
      run: |
        node --check web/logic.js
        node --check web/app.js
        node --test web/logic.test.cjs

    - name: Security and audit smoke check
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        from agents.base import SecurityException
        try:
            PHIGuard.assert_no_phi('MRN-994827')
            raise AssertionError('PHI detection did not reject test MRN')
        except SecurityException:
            pass
        print('Security & Zero-PHI Audit Passed!')
        "
